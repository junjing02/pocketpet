<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PocketPet — A Tiny Pixel Pet In Your Browser</title>
  <meta name="description" content="A tiny pixel-dot virtual pet that lives in your browser. Hatch a surprise egg, feed it, play mini-games, watch it grow, and pick it up again from any device. Free, no install." />
  <link rel="canonical" href="https://junjing02.github.io/pocketpet/" />

  <meta property="og:type" content="website" />
  <meta property="og:title" content="PocketPet — A Tiny Pixel Pet In Your Browser" />
  <meta property="og:description" content="Hatch a surprise egg, feed it, play mini-games, and watch it grow. Free, no install, right in your browser." />
  <meta property="og:url" content="https://junjing02.github.io/pocketpet/" />
  <meta property="og:image" content="https://junjing02.github.io/pocketpet/icons/og-banner.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="PocketPet — A Tiny Pixel Pet In Your Browser" />
  <meta name="twitter:description" content="Hatch a surprise egg, feed it, play mini-games, and watch it grow. Free, no install, right in your browser." />
  <meta name="twitter:image" content="https://junjing02.github.io/pocketpet/icons/og-banner.png" />

  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/icon.svg" />
  <meta name="theme-color" content="#111111" />
  <link rel="stylesheet" href="css/style.css?v=69" />
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Game",
    "name": "PocketPet",
    "description": "A tiny pixel-dot virtual pet that lives in your browser. Hatch a surprise egg, feed it, play mini-games, and watch it grow.",
    "url": "https://junjing02.github.io/pocketpet/",
    "image": "https://junjing02.github.io/pocketpet/icons/og-banner.png",
    "genre": "Simulation",
    "playMode": "SinglePlayer",
    "applicationCategory": "Game",
    "operatingSystem": "Any (web browser)",
    "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
  }
  </script>
</head>
<body>
  <div class="bg-decor" aria-hidden="true">
    <span class="bg-dot" style="top:10%; left:14%; animation-delay:0s;"></span>
    <span class="bg-dot" style="top:22%; left:82%; animation-delay:1.4s;"></span>
    <span class="bg-dot" style="top:72%; left:10%; animation-delay:2.6s;"></span>
    <span class="bg-dot" style="top:86%; left:78%; animation-delay:0.7s;"></span>
    <span class="bg-dot" style="top:48%; left:5%; animation-delay:1.9s;"></span>
    <span class="bg-dot" style="top:58%; left:93%; animation-delay:0.3s;"></span>
  </div>

  <main class="shell landing">
    <h1 class="title">PocketPet</h1>

    <div class="device">
      <div id="landing-pet" class="pet-screen"></div>
    </div>
    <p id="hero-stage-label" class="hero-stage-label"></p>

    <p class="tagline">Watch it grow, egg to adult. Every egg is a surprise, so you never know what you'll get.</p>

    <p class="landing-section-title">4 mini-games to earn coins</p>
    <div class="game-showcase">
      <div class="game-card">
        <div class="game-preview">
          <span class="preview-dot"></span>
        </div>
        <p class="game-card-name">Tap the Target</p>
      </div>
      <div class="game-card">
        <div class="game-preview">
          <span class="preview-track"><span class="preview-marker"></span></span>
        </div>
        <p class="game-card-name">Stop the Marker</p>
      </div>
      <div class="game-card">
        <div class="game-preview">
          <span class="preview-oddball"></span>
          <span class="preview-oddball"></span>
          <span class="preview-oddball preview-oddball--big"></span>
          <span class="preview-oddball"></span>
        </div>
        <p class="game-card-name">Odd One Out</p>
      </div>
      <div class="game-card">
        <div class="game-preview">
          <span class="preview-countdot" style="top:22%;left:28%"></span>
          <span class="preview-countdot" style="top:58%;left:62%"></span>
          <span class="preview-countdot" style="top:38%;left:78%"></span>
          <span class="preview-countdot" style="top:68%;left:22%"></span>
        </div>
        <p class="game-card-name">Count the Dots</p>
      </div>
    </div>

    <!-- Full evolution section: hidden for now, not deleted. Remove the
         `hidden` attribute below to bring it back. -->
    <div hidden>
      <p class="landing-section-title">Full evolution</p>
      <div class="evolution-panel">
        <div class="evolution-header">
          <div id="evolution-egg" class="evolution-stage"></div>
          <p class="evolution-intro">Every pet hatches from the same egg.</p>
        </div>
        <div id="evolution-rows" class="evolution-rows"></div>
      </div>
    </div>

    <a href="app.html" class="play-link">Play</a>
  </main>

  <p class="app-version" id="app-version"></p>

  <script type="module" src="js/landing.js?v=69"></script>
</body>
</html>
