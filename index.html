<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PocketPet</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="shell landing">
    <h1 class="title">PocketPet</h1>

    <div class="device">
      <div id="landing-pet" class="pet-screen"></div>
    </div>

    <p class="tagline">A tiny pixel-dot pet that lives in your browser.</p>

    <ul class="pitch">
      <li>Feed, play, clean, and put it to sleep</li>
      <li>Play a quick mini-game to earn coins for food</li>
      <li>Watch it grow: egg → baby → child → teen → adult</li>
      <li>Sign in anywhere to pick up the same pet</li>
    </ul>

    <a href="app.html" class="play-link">Play</a>
  </main>

  <script type="module" src="landing.js"></script>
</body>
</html>
