<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PocketPet</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/icon.svg" />
  <meta name="theme-color" content="#111111" />
  <link rel="stylesheet" href="css/style.css?v=23" />
</head>
<body>
  <div class="bg-decor" aria-hidden="true">
    <span class="bg-dot" style="top:10%; left:14%; animation-delay:0s;"></span>
    <span class="bg-dot" style="top:22%; left:82%; animation-delay:1.4s;"></span>
    <span class="bg-dot" style="top:72%; left:10%; animation-delay:2.6s;"></span>
    <span class="bg-dot" style="top:86%; left:78%; animation-delay:0.7s;"></span>
    <span class="bg-dot" style="top:48%; left:5%; animation-delay:1.9s;"></span>
    <span class="bg-dot" style="top:58%; left:93%; animation-delay:0.3s;"></span>
  </div>

  <main class="shell landing">
    <h1 class="title">PocketPet</h1>

    <div class="device">
      <div id="landing-pet" class="pet-screen"></div>
    </div>
    <p id="hero-stage-label" class="hero-stage-label"></p>

    <p class="tagline">Watch it grow, egg to adult. Every egg is a surprise, so you never know what you'll get.</p>

    <p class="landing-section-title">4 mini-games to earn coins</p>
    <div class="game-showcase">
      <div class="game-card">
        <div class="game-preview">
          <span class="preview-dot"></span>
        </div>
        <p class="game-card-name">Tap the Target</p>
      </div>
      <div class="game-card">
        <div class="game-preview">
          <span class="preview-track"><span class="preview-marker"></span></span>
        </div>
        <p class="game-card-name">Stop the Marker</p>
      </div>
      <div class="game-card">
        <div class="game-preview">
          <span class="preview-oddball"></span>
          <span class="preview-oddball"></span>
          <span class="preview-oddball preview-oddball--big"></span>
          <span class="preview-oddball"></span>
        </div>
        <p class="game-card-name">Odd One Out</p>
      </div>
      <div class="game-card">
        <div class="game-preview">
          <span class="preview-countdot" style="top:22%;left:28%"></span>
          <span class="preview-countdot" style="top:58%;left:62%"></span>
          <span class="preview-countdot" style="top:38%;left:78%"></span>
          <span class="preview-countdot" style="top:68%;left:22%"></span>
        </div>
        <p class="game-card-name">Count the Dots</p>
      </div>
    </div>

    <!-- Full evolution section: hidden for now, not deleted. Remove the
         `hidden` attribute below to bring it back. -->
    <div hidden>
      <p class="landing-section-title">Full evolution</p>
      <div class="evolution-panel">
        <div class="evolution-header">
          <div id="evolution-egg" class="evolution-stage"></div>
          <p class="evolution-intro">Every pet hatches from the same egg.</p>
        </div>
        <div id="evolution-rows" class="evolution-rows"></div>
      </div>
    </div>

    <a href="app.html" class="play-link">Play</a>
  </main>

  <script type="module" src="js/landing.js?v=23"></script>
</body>
</html>
